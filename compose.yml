# ClickHouse, its migrations and two tcpfp instances. Secrets and the TLS
# certificate come from .env (see .env.example).
#
# - tcpfp-http: plain HTTP on :80; the client's SYN arrives here directly.
# - tcpfp-https: HTTPS on 127.0.0.1:8081 behind a front proxy that owns :443 and
#   passes the client address with PROXY protocol v2 (for example HAProxy with
#   `send-proxy-v2`). The sniffer still watches SYNs to :443.
#
# Both share the host's network namespace and need CAP_NET_RAW to see SYNs.

x-tcpfp: &tcpfp
  build: .
  restart: unless-stopped
  network_mode: host
  cap_add:
    - NET_RAW
  env_file: .env
  depends_on:
    migrations:
      condition: service_completed_successfully

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # $$ leaves the variable to the container, so the password stays out of the compose config.
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrations:
    image: ghcr.io/amacneil/dbmate:2
    command: up
    environment:
      DATABASE_URL: clickhouse://default:${CLICKHOUSE_PASSWORD}@clickhouse:9000/default
    volumes:
      - ./migrations:/db/migrations
    depends_on:
      clickhouse:
        condition: service_healthy

  tcpfp-http:
    <<: *tcpfp
    environment:
      TCPFP_PORT: "80"
      TCPFP_CAPTURE_PORT: "80"
      TCPFP_STORE_SIZE: "4096"
      TCPFP_CLICKHOUSE_URL: http://127.0.0.1:18123
      TCPFP_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

  tcpfp-https:
    <<: *tcpfp
    environment:
      TCPFP_SECURE: "true"
      TCPFP_BIND: 127.0.0.1
      TCPFP_PORT: "8081"
      TCPFP_CAPTURE_PORT: "443"
      TCPFP_PROXY_PROTOCOL: "true"
      TCPFP_STORE_SIZE: "4096"
      TCPFP_CLICKHOUSE_URL: http://127.0.0.1:18123
      TCPFP_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  clickhouse-data:
